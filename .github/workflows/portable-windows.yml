name: Windows portable release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'portable/**'
      - 'models/README.md'
      - 'spec_check/**'
      - 'requirements*.txt'
      - 'scripts/build_windows_portable.py'
      - 'scripts/smoke_windows_portable.py'
      - 'tests/**'
      - '.github/workflows/portable-windows.yml'

permissions:
  contents: read

concurrency:
  group: portable-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            portable/requirements.lock.txt
      - name: Test application and packaging logic
        run: |
          python -m pip install -r requirements-dev.txt -c portable/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q spec_check portable scripts
      - name: Cache verified upstream downloads
        uses: actions/cache@v4
        with:
          path: .portable-cache
          key: portable-windows-${{ hashFiles('portable/build-lock.json', 'portable/requirements.lock.txt') }}
      - name: Build app ZIP without model
        run: python scripts/build_windows_portable.py --output-dir dist --cache-dir .portable-cache
      - name: Obtain pinned model separately for Windows verification
        run: |
          $model = python -c "import json; from pathlib import Path; from scripts.build_windows_portable import download_asset; lock=json.loads(Path('portable/build-lock.json').read_text(encoding='utf-8')); print(download_asset(lock['model'], Path('.portable-cache')).resolve())"
          if ($LASTEXITCODE -ne 0) { throw 'Independent model download or validation failed.' }
          "PORTABLE_SMOKE_MODEL=$model" >> $env:GITHUB_ENV
      - name: Test model import, extracted ZIP, real inference, review, export and shutdown
        timeout-minutes: 35
        run: python scripts/smoke_windows_portable.py --archive dist/LocalAIforSPECheck-Windows-x64.zip --report dist/portable-smoke-report.json --work-dir "$env:RUNNER_TEMP" --model-source "$env:PORTABLE_SMOKE_MODEL"
      - name: Keep small verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-verification-${{ github.sha }}
          path: dist/portable-smoke-report.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Publish verified download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = python -c "from spec_check import __version__; print(__version__)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid application version.' }
          $tag = "windows-portable-v$version-$($env:BUILD_SHA.Substring(0, 8))"
          $zip = 'dist/LocalAIforSPECheck-Windows-x64.zip'
          $checksums = 'dist/SHA256SUMS.txt'
          $report = 'dist/portable-smoke-report.json'
          foreach ($path in @($zip, $checksums, $report)) {
            if (-not (Test-Path $path)) { throw "Missing release asset: $path" }
          }
          $verification = Get-Content -Raw $report | ConvertFrom-Json
          if (-not $verification.passed) { throw 'Portable integration verification did not pass.' }
          if ((Get-Item $zip).Length -ge 2GB) { throw 'ZIP exceeds GitHub release asset limit.' }
          $notes = @"
          Windows 10/11 x64 免安裝版。下載 **LocalAIforSPECheck-Windows-x64.zip** 並完整解壓縮。初次使用請執行 **Download_model.bat**，模型就緒後執行 **Start.bat**；結束時使用 **Stop.bat**。

          ZIP 包含可攜式 Python、所有 Python 套件、llama.cpp CPU 推論服務，**不含 GGUF 模型**。模型與程式分開下載，之後更新程式可保留原本的 data 與 models。首次下載完成後可離線運作，不需安裝 Python 或 LM Studio。

          [獨立模型直連、校驗碼與手動下載說明](https://github.com/$env:GH_REPO/blob/$env:BUILD_SHA/models/README.md)。既有 v0.2 使用者可搬移舊版模型，不必重新下載。

          v0.3 加入可重用標準文件庫、獨立規格抽取與人工確認、全庫相關性及適用性初篩、候選／全量項目比對，以及風險、待補證據、未對應產品項目與覆核匯出。所有標準預設保留，只有人工記錄理由後才會排除；相關性、文件差異與風險優先度分開呈現。

          執行現況區塊提供目前規範、條目、產品分段、請求等待時間、最近模型回覆、程式連線狀態與事件紀錄。完成百分比只計算已儲存條目；等待模型回覆時不會虛構 token 或推論百分比。

          2B 模型用於入門與流程驗證。正式技術文件請先以人工標註案例驗收，必要時換較大 GGUF；模型輸出仍須人工覆核。公司若以應用程式控管禁止 EXE 執行，仍須依公司政策處理。

          已在 Windows CI 對本 ZIP 做：ZIP 不含模型檢查、缺模型操作提示、獨立模型校驗匯入及離線重用、中文及空白路徑、限制 PATH、內附 Python 套件、連接埠衝突、真實 CPU 模型 JSON 比對與原文證據、人工覆核紀錄、HTML/XLSX/JSON 匯出、v0.3 真模型抽取、標準保留、逐項比對與風險 JSON 報告、重啟保存與停止服務測試。這不是乾淨企業電腦驗證或模型準確率評測。

          操作與限制：[Windows Portable 說明](https://github.com/$env:GH_REPO/blob/$env:BUILD_SHA/docs/WINDOWS_PORTABLE.md)

          Source commit: $env:BUILD_SHA
          "@
          $notes | Set-Content -Encoding utf8 dist/release-notes.md
          # A commit-specific tag prevents replacing a previously published ZIP.
          $existingText = gh release view $tag --json isDraft,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists) {
            $existing = $existingText | ConvertFrom-Json
            if (-not $existing.isDraft) {
              $names = @($existing.assets | ForEach-Object { $_.name })
              foreach ($name in @('LocalAIforSPECheck-Windows-x64.zip', 'SHA256SUMS.txt', 'portable-smoke-report.json')) {
                if ($name -notin $names) { throw "Existing published release is missing asset: $name" }
              }
              Write-Host "This commit already has a published verified release: $tag"
              exit 0
            }
          } else {
            gh release create $tag --target $env:BUILD_SHA --draft --title "LocalAIforSPECheck Windows Portable v$version" --notes-file dist/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          gh release upload $tag $zip $checksums $report --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload portable release assets.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish portable release.' }
          @"
          ### Windows Portable ZIP published
          - [Download ZIP](https://github.com/$env:GH_REPO/releases/download/$tag/LocalAIforSPECheck-Windows-x64.zip)
          - [Checksums and verification report](https://github.com/$env:GH_REPO/releases/tag/$tag)
          - [Separate model download](https://github.com/$env:GH_REPO/blob/$env:BUILD_SHA/models/README.md)
          "@ >> $env:GITHUB_STEP_SUMMARY
